<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PENALTY KING</title><style>*{margin:0;box-sizing:border-box}body{background:#000;font-family:Arial;overflow:hidden}#g{width:100vw;height:100vh;position:relative;background:linear-gradient(#1a4d2e,#0a2a12);overflow:hidden}#goal{position:absolute;top:11%;left:6%;right:6%;height:42%;border:8px solid #fff;border-bottom:0;background:#bfeaff;z-index:1}#k{position:absolute;top:12%;left:50%;transform:translateX(-50%);width:200px;height:200px;z-index:2;transition:.45s}#k.l{transform:translateX(-50%) rotate(-35deg)}#k.r{transform:translateX(-50%) rotate(35deg)}#b{position:absolute;bottom:19%;left:50%;transform:translateX(-50%);width:75px;height:75px;z-index:3;transition:.5s}#h{position:absolute;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;color:#fff;z-index:20;font-weight:700}#h b{color:#FFD700}#m{position:absolute;top:57%;left:50%;transform:translate(-50%,-50%);z-index:20;color:#fff;font-weight:900;font-size:28px;text-align:center;text-shadow:0 3px 8px #000;width:95%}#c{position:absolute;bottom:0;left:0;right:0;padding:12px;background:#000c;z-index:20;text-align:center}#c p{color:#fff;margin-bottom:8px}.btns{display:flex;gap:8px}.btns button{flex:1;padding:14px;border:2px solid #fff;border-radius:12px;background:#0009;color:#fff;font-weight:700}.btns button.a{background:#FFD700;color:#000}#s{width:100%;margin-top:10px;padding:16px;border:0;border-radius:14px;background:#FFD700;font-size:20px;font-weight:900}#st{position:absolute;inset:0;background:#000;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}#st h1{color:#FFD700;font-size:48px}#st button{margin-top:20px;padding:16px 40px;border:0;border-radius:30px;background:#FFD700;font-size:20px;font-weight:900}</style></head><body><div id="g"><div id="h"><div>⭐ <b id="p">0</b> | ⚽ <b id="go">0</b>/5</div><div id="lv">LEVEL 1</div></div><div id="goal"></div><div id="k"><svg viewBox="0 0 200 200" width="100%" height="100%"><rect x="85" y="115" width="14" height="55" rx="7" fill="#111"/><rect x="105" y="115" width="14" height="55" rx="7" fill="#111"/><rect x="55" y="55" width="90" height="70" rx="18" fill="#FFD700" stroke="#000" stroke-width="3"/><text x="100" y="95" text-anchor="middle" font-size="28" font-weight="900">1</text><rect x="20" y="65" width="40" height="14" rx="7" fill="#FFD700" stroke="#000" transform="rotate(-25 40 70)"/><rect x="140" y="65" width="40" height="14" rx="7" fill="#FFD700" stroke="#000" transform="rotate(25 160 70)"/><circle cx="100" cy="32" r="26" fill="#f1c27d" stroke="#000" stroke-width="2"/><circle cx="92" cy="32" r="3" fill="#000"/><circle cx="108" cy="32" r="3" fill="#000"/></svg></div><svg id="b" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#fff" stroke="#000" stroke-width="3"/><polygon points="50,28 68,41 61,62 39,62 32,41" fill="#111"/></svg><div id="m">Choose Side!</div><div id="c"><p id="ct">You picked: CENTER</p><div class="btns"><button onclick="pk('left',this)">⬅ LEFT</button><button onclick="pk('center',this)" class="a">🎯 CENTER</button><button onclick="pk('right',this)">RIGHT ➡</button></div><button id="s" onclick="sh()">SHOOT NOW!</button></div><div id="st"><h1>PENALTY KING</h1><p>4 LEVELS - COMPLETE GAME</p><button onclick="stt()">▶ PLAY NOW</button></div></div><script>let L=1,G=0,T=0,P=0,ch='center',pl=false,K=document.getElementById('k'),B=document.getElementById('b'),M=document.getElementById('m');function pk(c,e){ch=c;document.querySelectorAll('.btns button').forEach(b=>b.classList.remove('a'));e.classList.add('a');document.getElementById('ct').innerText='You picked: '+c.toUpperCase()}function stt(){document.getElementById('st').style.display='none';pl=true;M.innerText='GO!';setTimeout(()=>M.innerText='',1000)}function sh(){if(!pl||T>=5)return;T++;let kc=['left','center','right'][Math.floor(Math.random()*3)];if(Math.random()<(L==1?.1:L==2?.25:L==3?.4:.55))kc=ch;let kx=kc=='left'?'20%':kc=='right'?'80%':'50%',bx=ch=='left'?'20%':ch=='right'?'80%':'50%';K.style.left=kx;K.className='';if(kc=='left')K.classList.add('l');if(kc=='right')K.classList.add('r');B.style.left=bx;B.style.bottom='52%';B.style.width='55px';B.style.height='55px';let sc=kc!==ch;document.getElementById('s').disabled=true;setTimeout(()=>{if(sc){G++;P+=10+L*5;M.innerText='GOAL! 🔥 +'+(10+L*5)}else M.innerText='SAVED! 🧤';document.getElementById('p').innerText=P;document.getElementById('go').innerText=G;setTimeout(()=>{K.style.left='50%';K.className='';B.style.left='50%';B.style.bottom='19%';B.style.width='75px';B.style.height='75px';document.getElementById('s').disabled=false;M.innerText='';if(T>=5){if(G>=3&&L<4){L++;T=0;G=0;document.getElementById('go').innerText=0;document.getElementById('lv').innerText='LEVEL '+L;M.innerText='LEVEL UP! 🏆';setTimeout(()=>M.innerText='',1800)}else if(G>=3&&L==4){M.innerText='👑 YOU ARE PENALTY KING!';pl=false}else{M.innerText='Try Again - Need 3/5';T=0;G=0;document.getElementById('go').innerText=0;setTimeout(()=>M.innerText='',2000)}}},900)},600)}</script></body></html>
